[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spongemock-api"
version = "1.0.0"
description = "A Flask API that randomizes the casing of text."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Flask>=3.0,<4.0",
    "gunicorn>=22.0,<24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["spongemock_api*"]
